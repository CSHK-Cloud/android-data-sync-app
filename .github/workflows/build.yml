name: Build Business APK (Native Kotlin)

on:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    # 💡 核心變更：直接使用 Android 官方命令列工具（Gradle）打包 APK，完全不通靈
    - name: Build with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Debug APK/AAB outputs
      run: |
        find android -type f \( -name "*.apk" -o -name "*.aab" \) | sort

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android/app/build/outputs/apk/**/*.apk
        if-no-files-found: error
