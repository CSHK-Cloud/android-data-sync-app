name: Build Business APK

on:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 💡 關鍵修正：一拿到程式碼，立刻「先」砸掉並重建 Android 外殼，避免它覆蓋你修改好的 main.dart
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Auto Create Clean Android Shell
      run: |

        # 1. 注入最高檔案權限
        rm -rf android build
        flutter create . --org com.cshk.datavault --project-name data_vault_sync --overwrite
        sed -i '/<application/i \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

        # 2. 🔥【新增】自動將 App 的桌面顯示名稱修改為你想設定的名字
        sed -i 's/android:label="data_vault_sync"/android:label="Data Vault Sync"/g' android/app/src/main/AndroidManifest.xml

    # 💡 步驟 2：執行程式碼深度大掃除
    - name: Code Deep Clean & Path Realignment
      run: |
        find lib/ -name "*.dart" -exec sed -i "s|sync_task_widget.dart|sync_tasks_widget.dart|g" {} +
        find lib/ -name "*.dart" -exec sed -i "s|sync_task_model.dart|sync_tasks_model.dart|g" {} +
        
        # 💡 強制還原：因為 flutter create . 會偷偷在 lib/ 放一個預設的 main.dart，我們必須用 Git 裡的正式版把它覆蓋回來！
        git checkout HEAD -- lib/main.dart
        
        flutter clean

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-pub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
