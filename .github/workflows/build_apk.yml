name: Build Business APK

on:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 💡 步驟 1：強制現場生成乾淨的 Android 2026/2027 最新安全外殼
      - name: Auto Create Clean Android Shell
        run: |
          rm -rf android build
          flutter create . --org com.cshk.datavault --project-name data_vault_sync
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

      # 💡 步驟 2：神級腳本大掃除！自動將所有檔案裡殘留的 flutterflow_ui 和 google_fonts 引用行徹底抹除，並對齊單複數檔名
      - name: Code Deep Clean & Path Realignment
        run: |
          find lib/ -name "*.dart" -exec sed -i "/flutterflow_ui/d" {} +
          find lib/ -name "*.dart" -exec sed -i "/google_fonts/d" {} +
          find lib/ -name "*.dart" -exec sed -i "s|sync_task_widget.dart|sync_tasks_widget.dart|g" {} +
          find lib/ -name "*.dart" -exec sed -i "s|sync_task_model.dart|sync_tasks_model.dart|g" {} +
          flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
