name: data_vault_sync
description: A pure native Flutter project for enterprise safe data sync and local erase.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # === 核心架構、狀態與導航管理（全部使用標準官方穩定版） ===
  provider: ^6.1.5
  intl: ^0.20.2
  timeago: ^3.7.0

  # === 🔥 實體本機空間釋放與 NAS 安全傳輸核心套件 ===
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  webdav_client: ^1.2.2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true